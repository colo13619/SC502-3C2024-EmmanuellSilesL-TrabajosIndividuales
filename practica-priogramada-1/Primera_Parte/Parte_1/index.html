<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primera_Parte</title>

    <link rel="stylesheet" href="./assets/style.css">

</head>



<body>
    <header class="encabezado">
        <div class="Registrationform">
            <h1>Registration Form</h1>
            <h2>Please fill out this form with the required information</h2>
        </div>

        <div>
            <form>
                <div>
                    <label form="nombre">Enter your first name :</label>
                    <br>
                    <input type="text" name="nombre" id="nombre" value="">
                </div>
                <div>
                    <label form="apellido">Enter your last name :</label>
                    <br>
                    <input type="text" name="apellido" id="apellido" value="">
                </div>
                <div>
                    <label form="correo">Enter email :</label>
                    <br>
                    <input type="text" name="correo" id="correo" value="">
                </div>
                <div>
                    <label form="contrasena">Create a New password : </label>
                    <br>
                    <input type="text" name="contrasena" id="contrasena" value="">
                </div>

                <hr>

                <div>
                    <p>Account Type (required)</p>

                    <input type="radio">
                    <label form="Personal">Personal</label>
                    <br>

                    <input type="radio">
                    <label form="Business">Business</label>

                </div>


                <br>
                <br>
                <hr>

                <div>
                    <label for="fotoDePerfil">Upload a profile picture:</label>
                    <br>
                    <input type="file" name="archivo" id="archivo" class="form-item">
                </div>

                <br>


                <div>
                    <label for="edad">Input your age(years) :</label>
                    <br>
                    <input type="number" name="edad" id="edad">
                </div>
                <br>

                <div>
                    <label for="opciones">How did you hear about us?</label>
                    <br>
                    <select name="opciones" id="opciones">
                        <option value="">(Select one)</option>
                        <option value="">freeCodeCamp News</option>
                        <option value="">freeCodeCamp Youtube Channel</option>
                        <option value="">freeCodeCamp Forum</option>
                        <option value="">other</option>
                    </select>

                </div>
                <br>
                <div>
                    <label for="bio">Provide a bio:</label>
                    <br>
                    <textarea name="bio" id="bio" rows="5" class="cuadro"></textarea>

                </div>


                <div>
                    <input type="radio" >
                    <label form="terminos">I accept the terms and conditions</label>
                    <br>

                </div>



                <div class="botonDelSubmit">
                    <br>
                    <br>
                    <input type="submit" class="submit" >


                </div>


            </form>


        </div>


    </header>



</body>

</html>
